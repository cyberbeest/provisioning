# Per-app data paths for the "Cyberbeest Wipe App Data" tool
# (lib/cyberbeest_wipe_app_data_gui.py).
# Format: id|display name|space-separated paths (relative to $HOME unless
# absolute; globs allowed, expand with nullglob)|pgrep -f pattern to detect
# a running instance (empty = checked a different way, see the tool itself)
#
# Source of truth for each path is the app's firejail whitelist (where
# jailed) -- that's exactly what the app is permitted to write to, so it's
# also exactly what needs wiping. Covers only apps installed by default or
# offered via provisioning; apps installed by other means (cyberbeest-install:
# URI, GNOME Software, manual .deb) are NOT covered here.
#
# Known gaps, don't try to "fix" by guessing:
#   - Feather (and any wallet app) can save wallet files anywhere via
#     "save as" -- only the default ~/.config/feather is listed.
#   - i2pd is a system service account under /var/lib/i2pd, not a per-user
#     path -- wiping it needs root (the tool uses pkexec for this one entry
#     only) and stops/restarts the service around the delete.
#   - Tor Browser: only the Data subdir is listed, not the whole tbb/*
#     tree, which also contains the installed browser binaries.

signal|Signal|.config/Signal|signal-desktop
element|Element|.config/Element|element-desktop
telegram|Telegram|.TelegramDesktop .local/share/TelegramDesktop .local/share/telegram-desktop|telegram-desktop
viber|Viber|.ViberPC|Viber
sparrow|Sparrow|.sparrow|Sparrow
feather|Feather|.config/feather|feather
torbrowser|Tor Browser|.local/share/torbrowser/tbb/*/tor-browser/Browser/TorBrowser/Data|TorBrowser/Browser/firefox
firefox|Firefox|.mozilla/firefox|firefox-esr
vlc|VLC|.config/vlc .local/share/vlc|vlc
i2pd|I2P (i2pd)||
