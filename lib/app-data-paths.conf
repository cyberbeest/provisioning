# Per-app data paths for the "Cyberbeest Wipe App Data" tool
# (lib/cyberbeest_wipe_app_data_gui.py).
# Format: id|display name|space-separated paths (relative to $HOME unless
# absolute; globs allowed, expand with nullglob)|pgrep -f pattern to detect
# a running instance (empty = checked a different way, see the tool itself)|
# dpkg package name used to check whether the app is currently installed
# (empty = skip the installed-check, rely on data presence alone)
#
# The tool only lists an app at all if it has data to wipe OR is currently
# installed -- so e.g. `apt remove` (no --purge) leaves user data behind
# and still wipeable, while an app that was never installed on this
# machine doesn't clutter the list.
#
# Source of truth for each path is the app's firejail whitelist (where
# jailed) -- that's exactly what the app is permitted to write to, so it's
# also exactly what needs wiping. Covers only apps installed by default or
# offered via provisioning; apps installed by other means (cyberbeest-install:
# URI, GNOME Software, manual .deb) are NOT covered here. Exception:
# simplex (below) -- exploratory watchlist install (see
# cyberbeest_messenger_watchlist memory), added anyway 2026-09-03 on
# explicit request since its data paths are simple and well-understood,
# unlike e.g. i2pd's system-account case. Don't take this as license to
# add every manually-installed app on the same reasoning -- ask first.
#
# Known gaps, don't try to "fix" by guessing:
#   - Feather (and any wallet app) can save wallet files anywhere via
#     "save as" -- only the default ~/.config/feather is listed.
#   - i2pd is a system service account under /var/lib/i2pd, not a per-user
#     path -- wiping it needs root (the tool uses pkexec for this one entry
#     only) and stops/restarts the service around the delete. Its
#     size_bytes() is always 0 (no per-user paths listed) -- the
#     installed-check via dpkg package is what actually surfaces it in the
#     list at all now, but its checkbox is still disabled by the separate,
#     pre-existing "checkbox disabled when size==0" logic, not addressed
#     by this change.
#   - Tor Browser: only the Data subdir is listed, not the whole tbb/*
#     tree, which also contains the installed browser binaries.

signal|Signal|.config/Signal|signal-desktop|signal-desktop
element|Element|.config/Element|element-desktop|element-desktop
telegram|Telegram|.TelegramDesktop .local/share/TelegramDesktop .local/share/telegram-desktop|telegram-desktop|telegram-desktop
viber|Viber|.ViberPC|Viber|viber
sparrow|Sparrow|.sparrow|Sparrow|sparrowwallet
feather|Feather|.config/feather|feather|feather-wallet
torbrowser|Tor Browser|.local/share/torbrowser/tbb/*/tor-browser/Browser/TorBrowser/Data|TorBrowser/Browser/firefox|torbrowser-launcher
firefox|Firefox|.mozilla/firefox|firefox-esr|firefox-esr
vlc|VLC|.config/vlc .local/share/vlc|vlc|vlc
i2pd|I2P (i2pd)|||i2pd
simplex|SimpleX|.config/simplex .local/share/simplex|simplex|simplex
